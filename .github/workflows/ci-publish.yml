name: CI / Publish

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, test and javadoc
        run: ./gradlew build javadoc --no-daemon

  maven-central-publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: test

    environment:
      name: maven-central
      url: https://central.sonatype.com/artifact/app.hookbase/hookbase-java

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # The published version comes from gradle.properties, like the other SDKs' manifests; this
      # fails the job if the release tag names a different one.
      - name: Check release tag matches version
        run: ./gradlew checkReleaseTag --no-daemon
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Publish to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral --no-daemon --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
